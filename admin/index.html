<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Chat inbox — Everything Shul</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="any" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  body { overflow-x: hidden; }
  .adm { max-width: 1200px; margin: 0 auto; padding: 24px var(--gutter) 60px; }
  .adm-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .adm-top h1 { font-size: 1.8rem; }
  .adm-top .meta { font-size: 0.85rem; color: var(--ink-3); display: flex; gap: 14px; align-items: center; }
  .gate { max-width: 420px; margin: 12vh auto 0; padding: 28px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-2); }
  .gate h1 { font-size: 1.7rem; margin-bottom: 8px; }
  .gate p { font-size: 0.95rem; margin-bottom: 18px; }
  .gate input { width: 100%; padding: 11px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: inherit; }
  .gate .err { color: #f0a39a; font-size: 0.88rem; min-height: 1.2em; margin-top: 8px; }
  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
  .list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper-2); max-height: 76vh; overflow-y: auto; }
  .item { display: block; width: 100%; text-align: left; padding: 12px 14px; border: none; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink-2); cursor: pointer; font: inherit; }
  .item:hover { background: rgba(37, 169, 234, 0.06); }
  .item.active { background: rgba(37, 169, 234, 0.12); }
  .item .row1 { display: flex; justify-content: space-between; gap: 8px; color: var(--ink); font-weight: 500; font-size: 0.95rem; }
  .item .row1 time { color: var(--ink-3); font-weight: 400; font-size: 0.78rem; white-space: nowrap; }
  .item .row2 { font-size: 0.83rem; color: var(--ink-3); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ff5d5d; margin-right: 7px; }
  .tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 1px 7px; border: 1px solid var(--line); border-radius: 99px; color: var(--ink-3); margin-left: 6px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--ink-3); font-size: 0.95rem; }
  .conv { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-2); display: flex; flex-direction: column; min-height: 60vh; max-height: 76vh; }
  .conv-head { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .conv-head strong { color: var(--ink); font-size: 1.05rem; font-weight: 500; }
  .conv-head a { color: var(--cyan-ink); }
  .conv-head .actions { display: flex; gap: 8px; }
  .small-btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink-2); font: inherit; font-size: 0.85rem; cursor: pointer; }
  .small-btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .small-btn.danger:hover { color: #ff8a80; border-color: #ff8a80; }
  .msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m small { display: block; font-size: 0.72rem; opacity: 0.7; margin-top: 4px; }
  .m.customer { align-self: flex-start; background: var(--panel); color: var(--ink); border-radius: 14px 14px 14px 3px; }
  .m.admin { align-self: flex-end; background: var(--cyan); color: var(--on-cyan); border-radius: 14px 14px 3px 14px; }
  .m.bot { align-self: flex-start; background: transparent; border: 1px dashed var(--line); color: var(--ink-3); border-radius: 14px 14px 14px 3px; }
  .reply { border-top: 1px solid var(--rule); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .reply textarea { width: 100%; min-height: 84px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; resize: vertical; }
  .reply textarea:focus { outline: none; border-color: var(--cyan); }
  .reply .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.82rem; color: var(--ink-3); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; z-index: 50; }
  .back { display: none; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .layout.open .list { display: none; }
    .layout:not(.open) .conv { display: none; }
    .back { display: inline-flex; }
    .m { max-width: 90%; }
  }
</style>
</head>
<body>
<main class="adm">
  <section class="gate" id="gate" hidden>
    <h1>Chat inbox</h1>
    <p>Enter the admin password to read and answer website chats.</p>
    <form id="gate-form">
      <input type="password" id="token" placeholder="Admin password" autocomplete="current-password" required />
      <button type="submit" class="btn">Open inbox</button>
      <p class="err" id="gate-err" role="alert"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="adm-top">
      <h1>Chat inbox</h1>
      <div class="meta"><span id="status">Loading…</span><button class="small-btn" id="logout">Sign out</button></div>
    </div>
    <div class="layout" id="layout">
      <div class="list" id="list"></div>
      <div class="conv" id="conv"><div class="empty">Pick a conversation to read it.</div></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<script src="../js/chat-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
