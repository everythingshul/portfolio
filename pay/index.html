<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Invoice — Everything Shul</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="any" />
<link rel="stylesheet" href="../css/invoice.css" />
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #e9ecf2; font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1b2433; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 22px 16px 70px; }
  .bar { max-width: 820px; margin: 0 auto 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .bar .who { font-size: 14px; color: #5b667a; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 8px; padding: 11px 22px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; background: #1b8fcf; color: #fff; transition: background .2s, transform .15s; }
  .btn:hover { background: #167db6; transform: translateY(-1px); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }
  .btn.ghost { background: #fff; color: #1b2433; border: 1px solid #cdd3de; }
  .btn.ghost:hover { background: #f4f6fa; }
  .btn.big { padding: 14px 30px; font-size: 16.5px; }
  .banner { max-width: 820px; margin: 0 auto 16px; padding: 13px 18px; border-radius: 8px; font-size: 14.5px; }
  .banner.ok { background: #e3f6ea; color: #17633a; border: 1px solid #b5e3c8; }
  .banner.info { background: #e6f1fb; color: #1d4f7c; border: 1px solid #bcd7ef; }
  .banner.err { background: #fdeaea; color: #8c2b20; border: 1px solid #f2c0bb; }
  .msg { text-align: center; padding: 90px 16px; color: #5b667a; }
  .msg h1 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; color: #1b2433; }
  .paybox { max-width: 820px; margin: 18px auto 0; display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; align-items: center; }
  .secure { font-size: 12.5px; color: #6b7587; }
  .paycard { max-width: 820px; margin: 18px auto 0; background: #fff; border-radius: 10px; padding: 24px 28px 22px; box-shadow: 0 10px 40px -12px rgba(0,0,0,.25); }
  .paycard h3 { margin: 0 0 14px; font-size: 1.25rem; font-weight: 700; color: #000624; }
  .paywait { padding: 26px 0; text-align: center; color: #6b7587; font-size: 14px; }
  .paymsg { min-height: 1.2em; margin: 12px 0 0; color: #b3261e; font-size: 14px; }
  .paymsg a { color: #1b8fcf; }
  .payrow { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 14px; }
  .payrow .secure { flex: 1 1 260px; }
  @media print { body { background: #fff; } .wrap { padding: 0; } }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="msg">Loading…</div></div>
<script src="../js/chat-config.js"></script>
<script src="../js/invoice-doc.js"></script>
<script src="pay.js"></script>
</body>
</html>
