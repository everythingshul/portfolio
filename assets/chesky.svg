<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Chesky">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5596"/>
      <stop offset="1" stop-color="#1c3764"/>
    </linearGradient>
    <clipPath id="round"><circle cx="100" cy="100" r="100"/></clipPath>
    <style>
      .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="200" height="200" fill="url(#bg)"/>

    <!-- white button-down shirt -->
    <path d="M14 200 C16 164 50 150 100 150 C150 150 184 164 186 200 Z" fill="#f4f7fc"/>
    <path d="M100 160 L100 200" stroke="#cfd8e8" stroke-width="2"/>
    <circle cx="100" cy="172" r="2.4" fill="#b9c4d8"/>
    <circle cx="100" cy="186" r="2.4" fill="#b9c4d8"/>
    <path d="M18 196 C22 170 44 156 70 152 M182 196 C178 170 156 156 130 152" fill="none" stroke="#e3e9f4" stroke-width="3"/>

    <!-- neck -->
    <path d="M84 126 L116 126 L118 152 C112 160 88 160 82 152 Z" fill="#e3b790"/>

    <!-- collar -->
    <path d="M80 146 L100 168 L92 150 Z" fill="#e8eef8" stroke="#cfd8e8" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M120 146 L100 168 L108 150 Z" fill="#e8eef8" stroke="#cfd8e8" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M78 142 C88 152 112 152 122 142 L124 150 L100 172 L76 150 Z" fill="#f4f7fc" stroke="#d6deec" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- face -->
    <ellipse cx="100" cy="92" rx="39" ry="44" fill="#f0c8a2"/>
    <ellipse cx="68" cy="98" rx="5" ry="8" fill="#e6b88f"/>
    <ellipse cx="132" cy="98" rx="5" ry="8" fill="#e6b88f"/>

    <!-- hair under and around the kippah -->
    <path d="M60 80 C56 56 70 42 100 42 C130 42 144 56 140 80 C138 70 134 62 128 58 C116 54 84 54 72 58 C66 62 62 70 60 80 Z" fill="#2b1d16"/>

    <!-- peyos: long hanging curls in front of the ears -->
    <g fill="none" stroke="#2b1d16" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M62 74 C57 92 58 108 62 120"/>
      <path d="M62 120 C54 126 53 138 61 143 C70 148 77 139 73 132 C70 127 63 128 65 134"/>
      <path d="M138 74 C143 92 142 108 138 120"/>
      <path d="M138 120 C146 126 147 138 139 143 C130 148 123 139 127 132 C130 127 137 128 135 134"/>
    </g>

    <!-- beard -->
    <path d="M61 98 C58 128 74 160 100 162 C126 160 142 128 139 98 C134 110 124 114 100 114 C76 114 66 110 61 98 Z" fill="#33231a"/>
    <path d="M61 98 C58 128 74 160 100 162 C126 160 142 128 139 98" fill="none" stroke="#2b1d16" stroke-width="3" stroke-linejoin="round"/>
    <!-- moustache -->
    <path d="M77 114 C86 106 94 110 100 113 C106 110 114 106 123 114 C114 120 106 117 100 116 C94 117 86 120 77 114 Z" fill="#2b1d16"/>
    <!-- smile -->
    <path d="M88 126 C94 134 106 134 112 126 C106 129 94 129 88 126 Z" fill="#fff"/>
    <path d="M88 126 C94 131 106 131 112 126" fill="none" stroke="#5b3a2c" stroke-width="2" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M96 92 C94 100 95 103 100 104 C105 103 106 100 104 92" fill="none" stroke="#dcae88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- eyes and brows -->
    <g class="blink"><ellipse cx="85" cy="84" rx="4.2" ry="5" fill="#241812"/><circle cx="86.4" cy="82.2" r="1.4" fill="#fff"/></g>
    <g class="blink"><ellipse cx="115" cy="84" rx="4.2" ry="5" fill="#241812"/><circle cx="116.4" cy="82.2" r="1.4" fill="#fff"/></g>
    <path d="M75 74 C80 69 88 69 93 73" fill="none" stroke="#2b1d16" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M107 73 C112 69 120 69 125 74" fill="none" stroke="#2b1d16" stroke-width="3.6" stroke-linecap="round"/>

    <!-- black kippah -->
    <path d="M70 52 C74 34 126 34 130 52 C124 58 76 58 70 52 Z" fill="#0c0d11"/>
    <path d="M74 50 C84 44 116 44 126 50" fill="none" stroke="#2a2d36" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
