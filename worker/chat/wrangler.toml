name = "everythingshul-chat"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://everythingshul.com,https://www.everythingshul.com"
SITE_URL = "https://everythingshul.com"
# ADMIN_EMAIL is the inbox that gets every chat notification (and a copy of each reply sent to a visitor).
# SENDER_EMAIL must be on the domain authenticated in Brevo (mail.everythingshul.com).
ADMIN_EMAIL = "everythingshul@gmail.com"
SENDER_EMAIL = "support@mail.everythingshul.com"
SENDER_NAME = "Everything Shul"
# Weekly summary email to ADMIN_EMAIL: "on" or "off".
DIGEST = "on"
# How long analytics are kept.
RETENTION_DAYS = "395"

# Conversation storage. Create it once with:  npx wrangler kv namespace create CHAT
# then paste the printed id below.
[[kv_namespaces]]
binding = "CHAT"
id = "149cbf4cdbe64dcb8801de42326321ec"

# Analytics database (Cloudflare D1). tools/deploy-workers.sh creates it and fills in the id.
[[d1_databases]]
binding = "STATS"
database_name = "everythingshul-stats"
database_id = "78745e90-b210-4a7c-96da-a00c2178681c"

# Customers, invoices and payments (Cloudflare D1). tools/deploy-workers.sh creates it and fills in the id.
# Secrets for online payments (typed into Cloudflare, never committed): STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET.
[[d1_databases]]
binding = "BILL"
database_name = "everythingshul-billing"
database_id = "PASTE_BILLING_D1_ID_HERE"

# Daily: cleanup of old analytics, recurring invoices and payment reminders. Monday morning: the website summary email.
[triggers]
crons = ["30 5 * * *", "0 13 * * 1"]

# Secrets (never committed):
#   npx wrangler secret put BREVO_API_KEY
#   npx wrangler secret put ADMIN_TOKEN     (a long random password for the /admin/ page)
