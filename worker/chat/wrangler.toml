name = "everythingshul-chat"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://everythingshul.com,https://www.everythingshul.com"
SITE_URL = "https://everythingshul.com"
# ADMIN_EMAIL is the inbox that gets every chat notification (and a copy of each reply sent to a visitor).
# SENDER_EMAIL must be on the domain authenticated in Brevo (mail.everythingshul.com).
ADMIN_EMAIL = "everythingshul@gmail.com"
SENDER_EMAIL = "support@mail.everythingshul.com"
SENDER_NAME = "Everything Shul"

# Conversation storage. Create it once with:  npx wrangler kv namespace create CHAT
# then paste the printed id below.
[[kv_namespaces]]
binding = "CHAT"
id = "149cbf4cdbe64dcb8801de42326321ec"

# Secrets (never committed):
#   npx wrangler secret put BREVO_API_KEY
#   npx wrangler secret put ADMIN_TOKEN     (a long random password for the /admin/ page)
