name = "everythingshul-contact"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
TO_EMAIL = "everythingshul@gmail.com"
# Must be a sender verified in Brevo (Senders, Domains & Dedicated IPs).
SENDER_EMAIL = "support@mail.everythingshul.com"
SENDER_NAME = "Everything Shul"
ALLOWED_ORIGINS = "https://everythingshul.com,https://www.everythingshul.com"
SITE_URL = "https://everythingshul.com"

# Secret (never committed): wrangler secret put BREVO_API_KEY

# Customer list and billing database (Cloudflare D1), shared with the chat Worker so contact form messages become leads.
# tools/deploy-workers.sh creates it and fills in the id.
[[d1_databases]]
binding = "BILL"
database_name = "everythingshul-billing"
database_id = "PASTE_BILLING_D1_ID_HERE"
